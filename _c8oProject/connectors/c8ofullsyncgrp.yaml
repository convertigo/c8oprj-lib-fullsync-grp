    →: |
      '{
        "_id": "_design\/design",
        "filters": {},
        "updates": {},
        "views": {
          "get_users_by_group": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGrp\" && doc.user && doc.group) {\r\n
                  emit(doc.group, doc.user);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "get_groups_by_user": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGrp\" && doc.user && doc.group) {\r\n
                  emit(doc.user, doc.group);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "get_roles_by_group": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGrpRole\" && doc.group && doc.role) {\r\n
                  emit(doc.group, doc.role);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "get_groups_by_role": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGrpRole\" && doc.group && doc.role) {\r\n
                  emit(doc.role, doc.group);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "get_groups_count_by_role": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGrpRole\" && doc.group && doc.role) {\r\n
                  emit(doc.role, doc.group);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "get_groups": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGrp\" && doc.group) {\r\n
                  emit(doc.group, 1);\r\n
              } else if (doc.type == \"c8oGroupAttributes\" && doc.group) {\r\n
                  emit(doc.group, 0);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_sum"
          },
          "get_roles": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGrpRole\" && doc.role) {\r\n
                  emit(doc.role, 1);\r\n
              } else if (doc.type == \"c8oRoleAttributes\" && doc.role) {\r\n
                  emit(doc.role, 0);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_sum"
          },
          "get_permissions_by_role": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oRolePerm\" && doc.role && doc.permission) {\r\n
                  emit(doc.role, doc.permission);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "get_roles_by_permission": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oRolePerm\" && doc.role && doc.permission) {\r\n
                  emit(doc.permission, doc.role);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "get_roles_count_by_permission": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oRolePerm\" && doc.role && doc.permission) {\r\n
                  emit(doc.permission, doc.role);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_count"
          },
          "get_permissions": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oRolePerm\" && doc.permission) {\r\n
                  emit(doc.permission, 1);\r\n
              } else if (doc.type == \"c8oPermissionAttributes\" && doc.permission) {\r\n
                  emit(doc.permission, 0);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }",
            "reduce": "_sum"
          },
          "get_group_attributes_by_group": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oGroupAttributes\" && doc.group) {\r\n
                  var attrs = doc.attributes || {};\r\n
                  if (!doc.attributes) {\r\n
                      for (var p in doc) {\r\n
                          if (doc.hasOwnProperty(p) && p.charAt(0) != \"_\" && p != \"type\" && p != \"group\") {\r\n
                              attrs[p] = doc[p];\r\n
                          }\r\n
                      }\r\n
                  }\r\n
                  emit(doc.group, attrs);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "get_role_attributes_by_role": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oRoleAttributes\" && doc.role) {\r\n
                  var attrs = doc.attributes || {};\r\n
                  if (!doc.attributes) {\r\n
                      for (var p in doc) {\r\n
                          if (doc.hasOwnProperty(p) && p.charAt(0) != \"_\" && p != \"type\" && p != \"role\") {\r\n
                              attrs[p] = doc[p];\r\n
                          }\r\n
                      }\r\n
                  }\r\n
                  emit(doc.role, attrs);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "get_permission_attributes_by_permission": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.type == \"c8oPermissionAttributes\" && doc.permission) {\r\n
                  var attrs = doc.attributes || {};\r\n
                  if (!doc.attributes) {\r\n
                      for (var p in doc) {\r\n
                          if (doc.hasOwnProperty(p) && p.charAt(0) != \"_\" && p != \"type\" && p != \"permission\") {\r\n
                              attrs[p] = doc[p];\r\n
                          }\r\n
                      }\r\n
                  }\r\n
                  emit(doc.permission, attrs);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "get_attributes_by_kind_name_value": {
            "map": "function (doc) {\r\n
          try {\r\n
              var kind = null;\r\n
              var entity = null;\r\n
              if (doc.type == \"c8oGroupAttributes\" && doc.group) {\r\n
                  kind = \"group\";\r\n
                  entity = doc.group;\r\n
              } else if (doc.type == \"c8oRoleAttributes\" && doc.role) {\r\n
                  kind = \"role\";\r\n
                  entity = doc.role;\r\n
              } else if (doc.type == \"c8oPermissionAttributes\" && doc.permission) {\r\n
                  kind = \"permission\";\r\n
                  entity = doc.permission;\r\n
              }\r\n
              if (kind && entity) {\r\n
                  var attrs = doc.attributes || null;\r\n
                  if (attrs) {\r\n
                      for (var a in attrs) {\r\n
                          if (attrs.hasOwnProperty(a)) {\r\n
                              emit([kind, a, attrs[a]], {name: entity, attributes: attrs});\r\n
                          }\r\n
                      }\r\n
                  } else {\r\n
                      for (var p in doc) {\r\n
                          if (doc.hasOwnProperty(p) && p.charAt(0) != \"_\" && p != \"type\" && p != \"group\" && p != \"role\" && p != \"permission\") {\r\n
                              emit([kind, p, doc[p]], {name: entity, attributes: doc});\r\n
                          }\r\n
                      }\r\n
                  }\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          }
        }
      }'