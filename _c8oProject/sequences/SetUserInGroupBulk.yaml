↓CalcID [steps.SimpleStep-1594128461727]: 
  expression: |
    'var jDoc = JSON.parse('''' + com.twinsoft.convertigo.engine.util.XMLUtils.XmlToJson(myNodeList.item(0), true, true));
    var bulk = jDoc.groups.complex;
    if (!Array.isArray(bulk)) {
        bulk = [bulk];
    }
    var authorizationGroups = [];
    var seenAuthorizationGroups = {};
    for (var i in bulk) {
        bulk[i]["_id"] = "" + org.apache.commons.codec.digest.DigestUtils.sha256Hex(bulk[i]["user"] + ":" + bulk[i]["group"]);
        bulk[i]["type"] = "c8oGrp";
        var authorizationGroup = ('''' + bulk[i]["group"]).trim();
        if (!seenAuthorizationGroups[authorizationGroup]) {
            seenAuthorizationGroups[authorizationGroup] = true;
            authorizationGroups.push(authorizationGroup);
        }
    }
    groups = JSON.stringify(authorizationGroups);'
