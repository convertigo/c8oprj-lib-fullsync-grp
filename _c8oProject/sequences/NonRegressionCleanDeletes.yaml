    var nrCleanRole = "nr_clean_delete_role";
    var nrCleanRoleGroupA = "nr_clean_role_group_a";
    var nrCleanRoleGroupB = "nr_clean_role_group_b";
    var nrCleanRolePerm = "nr_clean_role.delete:read";
    var nrCleanPermission = "nr_clean_permission.delete:all";
    var nrCleanPermRoleA = "nr_clean_perm_role_a";
    var nrCleanPermRoleB = "nr_clean_perm_role_b";
    var nrCleanPermGroupA = "nr_clean_perm_group_a";
    var nrCleanPermGroupB = "nr_clean_perm_group_b";
    
    function nrId(left, right) {
        return org.apache.commons.codec.digest.DigestUtils.sha256Hex(left + ":" + right);
    }
    
    function userGroupDoc(userName, groupName, deleted) {
        var doc = {_id: nrId(userName, groupName)};
        if (deleted) {
            doc._deleted = true;
        } else {
            doc.type = "c8oGrp";
            doc.user = userName;
            doc.group = groupName;
            doc["~c8oAcl"] = "c8o:admin";
        }
        return doc;
    }
    
    function groupRoleDoc(groupName, roleName, deleted) {
        roleName = roleName.trim().toLowerCase();
        var doc = {_id: nrId(groupName, roleName)};
        if (deleted) {
            doc._deleted = true;
        } else {
            doc.type = "c8oGrpRole";
            doc.group = groupName;
            doc.role = roleName;
            doc["~c8oAcl"] = "c8o:admin";
        }
        return doc;
    }
    
    function rolePermissionDoc(roleName, permissionName, deleted) {
        roleName = roleName.trim().toLowerCase();
        permissionName = permissionName.trim().toLowerCase();
        var parts = permissionName.split(":");
        var left = parts[0].split(".");
        var doc = {_id: nrId(roleName, permissionName)};
        if (deleted) {
            doc._deleted = true;
        } else {
            doc.type = "c8oRolePerm";
            doc.role = roleName;
            doc.element = left[0];
            doc.action = left[1];
            doc.scope = parts[1];
            doc.permission = permissionName;
            doc["~c8oAcl"] = "c8o:admin";
        }
        return doc;
    }
    
    function attributesDoc(kind, name, attrs, deleted) {
        var prefix = kind + "Attributes";
        name = kind == "group" ? name : name.trim().toLowerCase();
        var doc = {_id: org.apache.commons.codec.digest.DigestUtils.sha256Hex(prefix + ":" + name)};
        if (deleted) {
            doc._deleted = true;
            return doc;
        }
        if (kind == "group") {
            doc.type = "c8oGroupAttributes";
            doc.group = name;
        } else if (kind == "role") {
            doc.type = "c8oRoleAttributes";
            doc.role = name;
        } else if (kind == "permission") {
            doc.type = "c8oPermissionAttributes";
            doc.permission = name;
        }
        doc.attributes = attrs || {};
        return doc;
    }
    
    var cleanupDocs = [
        userGroupDoc(nrCleanUser, nrCleanGroup, true),
        groupRoleDoc(nrCleanGroup, nrCleanGroupRole, true),
        attributesDoc("group", nrCleanGroup, {}, true),
        groupRoleDoc(nrCleanRoleGroupA, nrCleanRole, true),
        groupRoleDoc(nrCleanRoleGroupB, nrCleanRole, true),
        rolePermissionDoc(nrCleanRole, nrCleanRolePerm, true),
        attributesDoc("role", nrCleanRole, {}, true),
        groupRoleDoc(nrCleanPermGroupA, nrCleanPermRoleA, true),
        groupRoleDoc(nrCleanPermGroupB, nrCleanPermRoleB, true),
        rolePermissionDoc(nrCleanPermRoleA, nrCleanPermission, true),
        rolePermissionDoc(nrCleanPermRoleB, nrCleanPermission, true),
        attributesDoc("permission", nrCleanPermission, {}, true)
    ];
    var _use_json_base = JSON.stringify(cleanupDocs);'
