    var nrGroupB = "nr_group_b";
    var nrGroupBulk = "nr_group_bulk";
    var nrGroupOld = "nr_group_old";
    var nrGroupNew = "nr_group_new";
    var nrBulkUser1 = "nr_bulk_1";
    var nrBulkUser2 = "nr_bulk_2";
    var nrRoleReader = "nr_reader";
    var nrRoleWriter = "nr_writer";
    var nrPermissionOwn = "nr_feature.read:own";
    var nrPermissionAll = "nr_feature.read:all";
    
    function nrId(left, right) {
    	return org.apache.commons.codec.digest.DigestUtils.sha256Hex(left + ":" + right);
    }
    
    function nrUserGroupDoc(userName, groupName, deleted) {
    	var doc = {_id: nrId(userName, groupName)};
    	if (deleted) {
    		doc._deleted = true;
    	} else {
    		doc.type = "c8oGrp";
    		doc.user = userName;
    		doc.group = groupName;
    		doc["~c8oAcl"] = "c8o:admin";
    	}
    	return doc;
    }
    
    function nrGroupRoleDoc(groupName, roleName, deleted) {
    	roleName = roleName.trim().toLowerCase();
    	var doc = {_id: nrId(groupName, roleName)};
    	if (deleted) {
    		doc._deleted = true;
    	} else {
    		doc.type = "c8oGrpRole";
    		doc.group = groupName;
    		doc.role = roleName;
    		doc["~c8oAcl"] = "c8o:admin";
    	}
    	return doc;
    }
    
    function nrRolePermissionDoc(roleName, elementName, actionName, scopeName, deleted) {
    	roleName = roleName.trim().toLowerCase();
    	elementName = elementName.trim().toLowerCase();
    	actionName = actionName.trim().toLowerCase();
    	scopeName = scopeName.trim().toLowerCase();
    	var permissionName = elementName + "." + actionName + ":" + scopeName;
    	var doc = {_id: nrId(roleName, permissionName)};
    	if (deleted) {
    		doc._deleted = true;
    	} else {
    		doc.type = "c8oRolePerm";
    		doc.role = roleName;
    		doc.element = elementName;
    		doc.action = actionName;
    		doc.scope = scopeName;
    		doc.permission = permissionName;
    		doc["~c8oAcl"] = "c8o:admin";
    	}
    	return doc;
    }
    
    var cleanupDocs = [
    	nrUserGroupDoc(nrUserA, nrGroupA, true),
    	nrUserGroupDoc(nrUserA, nrGroupB, true),
    	nrUserGroupDoc(nrUserB, nrGroupB, true),
    	nrUserGroupDoc(nrBulkUser1, nrGroupBulk, true),
    	nrUserGroupDoc(nrBulkUser2, nrGroupBulk, true),
    	nrUserGroupDoc(nrUserA, nrGroupOld, true),
    	nrUserGroupDoc(nrUserA, nrGroupNew, true),
    	nrGroupRoleDoc(nrGroupA, nrRoleReader, true),
    	nrGroupRoleDoc(nrGroupB, nrRoleReader, true),
    	nrGroupRoleDoc(nrGroupB, nrRoleWriter, true),
    	nrRolePermissionDoc(nrRoleReader, "nr_feature", "read", "own", true),
    	nrRolePermissionDoc(nrRoleReader, "nr_feature", "read", "all", true),
    	nrRolePermissionDoc(nrRoleWriter, "nr_feature", "write", "all", true)
    ];
    var _use_json_base = JSON.stringify(cleanupDocs);'
