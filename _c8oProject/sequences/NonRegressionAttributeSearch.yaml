↓InitCleanup [steps.SimpleStep-1784565601074]: 
  expression: |
    'var nrGroup = "nr_search_attr_group";
    var nrRole = "nr_search_attr_role";
    var nrPermission = "nr_search.attr:read";
    
    function attributesDoc(kind, name, attrs, deleted) {
        var prefix = kind + "Attributes";
        name = kind == "group" ? name : name.trim().toLowerCase();
        var doc = {_id: org.apache.commons.codec.digest.DigestUtils.sha256Hex(prefix + ":" + name)};
        if (deleted) {
            doc._deleted = true;
            return doc;
        }
        if (kind == "group") {
            doc.type = "c8oGroupAttributes";
            doc.group = name;
        } else if (kind == "role") {
            doc.type = "c8oRoleAttributes";
            doc.role = name;
        } else if (kind == "permission") {
            doc.type = "c8oPermissionAttributes";
            doc.permission = name;
        }
        doc.attributes = attrs || {};
        return doc;
    }
    
    var cleanupDocs = [
        attributesDoc("group", nrGroup, {}, true),
        attributesDoc("role", nrRole, {}, true),
        attributesDoc("permission", nrPermission, {}, true)
    ];
    var _use_json_base = JSON.stringify(cleanupDocs);'
