accessibility: Private
comment: Evaluate whether the current authenticated user may administer every distinct group in a JSON array. All checks finish before callers start a bulk write. When the global delegation symbol is empty, the sequence returns allowed=true without per-group calls.
↓ValidateAndInitialize [steps.SimpleStep-1790066955658]: 
  expression: |
    'var configuredAdminGroups = ${lib.fullsyncgrp.delegation.adminGroups=[]};
    if (!Array.isArray(configuredAdminGroups)) {
        throw ''The symbol "lib.fullsyncgrp.delegation.adminGroups" must contain a JSON array'';
    }
    var delegationEnabled = configuredAdminGroups.length > 0;
    var rawGroups = groups;
    if (!Array.isArray(rawGroups)) {
        var rawGroupsText = rawGroups == undefined ? '''' : ('''' + rawGroups).trim();
        if (rawGroupsText.length < 1) {
            throw ''The "groups" parameter must be a JSON array'';
        }
        rawGroups = JSON.parse(rawGroupsText);
    }
    if (!Array.isArray(rawGroups)) {
        throw ''The "groups" parameter must be a JSON array'';
    }
    var normalizedGroups = [];
    var seenGroups = {};
    for (var i = 0; i < rawGroups.length; i++) {
        if (typeof rawGroups[i] != ''string'' || rawGroups[i].trim().length < 1) {
            throw ''The "groups" parameter must contain only non-empty group names'';
        }
        var normalizedGroup = rawGroups[i].trim();
        if (!seenGroups[normalizedGroup]) {
            seenGroups[normalizedGroup] = true;
            normalizedGroups.push(normalizedGroup);
        }
    }
    var allAllowed = true;
    var deniedGroup = '''';
    var denialReason = '''';
    var checkedCount = 0;'
