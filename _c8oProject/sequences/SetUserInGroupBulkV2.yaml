↓Sequence_ComputeGroups [steps.SimpleStep-1741257238328]: 
  expression: |
    'var _use_json_base = [];
    users = JSON.parse(users);
    groups = JSON.parse(groups);
    if (!Array.isArray(users) || !Array.isArray(groups)) {
        throw ''The "users" and "groups" parameters must be JSON arrays'';
    }
    for (var i = 0; i < users.length; i++) {
        for (var j = 0; j < groups.length; j++) {
            _use_json_base.push({
                _id: org.apache.commons.codec.digest.DigestUtils.sha256Hex(users[i] + ":" + groups[j]),
                user: users[i],
                group: groups[j],
                type: "c8oGrp"
            });
        }
    }
    _use_json_base = JSON.stringify(_use_json_base);
    groups = JSON.stringify(groups);'
